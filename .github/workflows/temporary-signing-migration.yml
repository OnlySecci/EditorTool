name: Secure signing-key migration
on:
  push:
    branches: ['feat/v1.5.3-security-hardening']
    paths: ['.github/workflows/temporary-signing-migration.yml']
permissions:
  contents: read
jobs:
  encrypted-transfer:
    if: github.actor == 'OnlySecci'
    runs-on: ubuntu-24.04
    steps:
      - name: Encrypt existing signing key for the owner
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
          OWNER_RECOVERY_PUBLIC_KEY: 
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          secret=os.environ['UPDATE_SIGNING_KEY_B64']
          if not secret or len(secret)>250: raise SystemExit('Existing Ed25519 signing secret is unavailable or invalid')
          folder=Path(os.environ['RUNNER_TEMP'])
          public=folder/'owner-recovery.pem'
          public.write_bytes(base64.b64decode(os.environ['OWNER_RECOVERY_PUBLIC_KEY'],validate=True))
          child_env={k:v for k,v in os.environ.items() if k!='UPDATE_SIGNING_KEY_B64'}
          result=subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',str(public),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256'],input=secret.encode('ascii'),capture_output=True,env=child_env)
          if result.returncode or len(result.stdout)!=384: raise SystemExit('Encrypted migration failed; details suppressed')
          (folder/'update-key-transfer.enc').write_bytes(result.stdout)
          print('Existing signing material encrypted for the owner; no plaintext key exported.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-signing-migration
          path: ${{ runner.temp }}/update-key-transfer.enc
          retention-days: 1
          if-no-files-found: error
