[package]
name = "editortool"
version = "1.5.4"
edition = "2021"
rust-version = "1.90"
description = "Lightweight native editor for text, code and images"
license = "Unlicense"

[features]
default = ["bundled-fltk"]
bundled-fltk = ["fltk/fltk-bundled"]

[dependencies]
ring = "0.17"
zeroize = "1"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"] }
time = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
socket2 = { version = "0.6", features = ["all"] }
network-interface = "2"
mio = { version = "1", features = ["net", "os-poll"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
fltk = "=1.5.23"
regex = "1"
similar = "2.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
dbus = { version = "0.9", features = ["vendored"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
url = "2"
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
