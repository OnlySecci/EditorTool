[package]
name = "editortool"
version = "1.4.8"
edition = "2021"
rust-version = "1.90"
description = "Schlanker Plaintext-Editor mit Textvergleich"
license = "Unlicense"

[features]
default = ["bundled-fltk"]
bundled-fltk = ["fltk/fltk-bundled"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
socket2 = "0.6"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
fltk = "=1.5.23"
regex = "1"
similar = "2.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
