[package]
name = "editortool"
version = "1.3.0"
edition = "2021"
rust-version = "1.89"
description = "Schlanker Plaintext-Editor mit Textvergleich"
license = "Unlicense"

[features]
default = ["bundled-fltk"]
bundled-fltk = ["fltk/fltk-bundled"]

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
fltk = "=1.5.23"
regex = "1"
similar = "2.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
